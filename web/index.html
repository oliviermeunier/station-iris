<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Station Iris — météo et eau près de chez vous</title>
    <meta name="description" content="Pluie, températures, nappes et rivières autour de chez vous, comparées à ce qui a déjà été observé. Gratuit, sans publicité, sans pistage." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the theme before first paint to avoid a flash of the wrong colours.
      try {
        const stored = localStorage.getItem('iris.theme');
        const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
